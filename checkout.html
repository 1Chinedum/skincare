<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Place Order | [BUSINESS NAME]</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">BN</span><span>[BUSINESS NAME]</span></a><button class="menu-toggle" aria-label="Open menu">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a></nav></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Almost there</span><h1>Your order.</h1><p class="lead">Add your details and we will prepare a WhatsApp message for you to review and send.</p></div></section><section class="container cart-layout"><form id="order-form"><div class="form-grid"><div class="field"><label for="name">Full name *</label><input id="name" required></div><div class="field"><label for="phone">Phone number *</label><input id="phone" type="tel" required></div><div class="field"><label for="whatsapp">WhatsApp number *</label><input id="whatsapp" type="tel" required></div><div class="field"><label for="email">Email (optional)</label><input id="email" type="email"></div><div class="field full"><label for="address">Delivery address *</label><textarea id="address" required></textarea></div><div class="field"><label for="city">City *</label><input id="city" required></div><div class="field"><label for="state">State *</label><input id="state" required></div><div class="field full"><label for="note">Additional note (optional)</label><textarea id="note"></textarea></div></div><div id="form-message"></div><button class="button" type="submit">Place order on WhatsApp</button></form><aside id="order-summary" class="summary"></aside></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 [BUSINESS NAME]. All rights reserved.</span><span>Independent Oriflame partner/consultant.</span></div></footer><script src="js/products.js"></script><script src="js/main.js"></script><script>const cart = getCart(); const summary = document.getElementById('order-summary'); if (!cart.length) { document.getElementById('order-form').innerHTML = '<div class="empty"><h2>Your cart is empty.</h2><a class="button" href="products.html">Browse products</a></div>'; } else { let total = 0; summary.innerHTML = '<h3>Your order</h3>' + cart.map(item => { const product = getProduct(item.id); const subtotal = product.price * item.quantity; total += subtotal; return `<div class="summary-line"><span>${product.name} × ${item.quantity}</span><strong>${money(subtotal)}</strong></div>`; }).join('') + `<div class="summary-total"><span>Total</span><span>${money(total)}</span></div>`; document.getElementById('order-form').addEventListener('submit', event => { event.preventDefault(); const value = id => document.getElementById(id).value.trim(); let message = `NEW ORDER%0A%0ACustomer Name: ${value('name')}%0APhone: ${value('phone')}%0AWhatsApp: ${value('whatsapp')}%0AEmail: ${value('email') || 'Not provided'}%0A%0ADelivery Address:%0A${value('address')}, ${value('city')}, ${value('state')}%0A%0AORDER DETAILS%0A%0A`; cart.forEach((item, index) => { const product = getProduct(item.id); message += `${index + 1}. ${product.name}%0AQuantity: ${item.quantity}%0APrice: ${money(product.price)}%0ASubtotal: ${money(product.price * item.quantity)}%0A%0A`; }); message += `TOTAL: ${money(total)}%0A%0ACustomer Note:%0A${value('note') || 'None'}`; window.open(`https://wa.me/2348034904908?text=${message}`, '_blank'); }); }</script></body></html>
