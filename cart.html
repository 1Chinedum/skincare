<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Cart | UKCosmetics</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">BN</span><span>UKCosmetics</span></a><button class="menu-toggle" aria-label="Open menu">â˜°</button><nav class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="skincare-tips.html">Tips</a><a href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a></nav></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Your selection</span><h1>Cart.</h1></div></section><section class="container cart-layout"><div id="cart-items"></div><aside id="cart-summary" class="summary"></aside></section></main><footer class="site-footer"><div class="container footer-bottom"><span>Â© 2026 UKCosmetics. All rights reserved.</span><span>Independent Oriflame partner/consultant.</span></div></footer><script src="js/products.js"></script><script src="js/main.js"></script><script>const items = document.getElementById('cart-items'); const summary = document.getElementById('cart-summary'); function renderCart() { const cart = getCart(); if (!cart.length) { items.innerHTML = '<div class="empty"><h2>Your cart is empty.</h2><p>There is plenty to discover.</p><a class="button" href="products.html">Browse products</a></div>'; summary.innerHTML = ''; return; } let total = 0; items.innerHTML = cart.map(item => { const product = getProduct(item.id); const subtotal = product.price * item.quantity; total += subtotal; return `<div class="cart-row"><img src="${product.image}" alt="${product.name}"><div><h3>${product.name}</h3><p>${money(product.price)} each</p><div class="quantity"><button onclick="changeQuantity('${item.id}', -1)" aria-label="Decrease quantity">âˆ’</button><span>${item.quantity}</span><button onclick="changeQuantity('${item.id}', 1)" aria-label="Increase quantity">+</button></div></div><strong class="row-total">${money(subtotal)}</strong><button class="remove" onclick="removeItem('${item.id}')">Remove</button></div>`; }).join(''); summary.innerHTML = `<h3>Order summary</h3><div class="summary-total"><span>Total</span><span>${money(total)}</span></div><a class="button" href="checkout.html">Proceed to order</a>`; } function changeQuantity(id, change) { const cart = getCart(); const item = cart.find(entry => entry.id === id); item.quantity += change; if (item.quantity < 1) cart.splice(cart.indexOf(item), 1); saveCart(cart); renderCart(); } function removeItem(id) { saveCart(getCart().filter(item => item.id !== id)); renderCart(); } renderCart();</script></body></html>
