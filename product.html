<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product | [BUSINESS NAME]</title><meta name="description" content="Product details from [BUSINESS NAME]."><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">BN</span><span>[BUSINESS NAME]</span></a><button class="menu-toggle" aria-label="Open menu">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="skincare-tips.html">Tips</a><a href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a></nav></div></header><main><div id="product-detail" class="container"></div></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 [BUSINESS NAME]. All rights reserved.</span><span>Independent Oriflame partner/consultant.</span></div></footer><script src="js/products.js"></script><script src="js/main.js"></script><script>const product = getProduct(new URLSearchParams(location.search).get('id')); const detail = document.getElementById('product-detail'); if (!product) detail.innerHTML = '<section class="empty"><h2>Product not found.</h2><p><a class="text-link" href="products.html">Return to products →</a></p></section>'; else { document.title = `${product.name} | [BUSINESS NAME]`; detail.innerHTML = `<section class="detail"><div><img class="detail-main-image" src="${product.image}" alt="${product.name}"></div><div class="detail-info"><span class="eyebrow">${product.category}</span><h1>${product.name}</h1><span class="price">${money(product.price)}</span><p class="detail-copy">${product.description}</p><div class="detail-list"><strong>Benefits</strong><span>${product.benefits}</span></div><div class="detail-list"><strong>How to use</strong><span>${product.usage}</span></div><div class="detail-list"><strong>Ingredients</strong><span>${product.ingredients}</span></div><div class="detail-list"><strong>Availability</strong><span>${product.availability}</span></div><div style="margin-top:28px"><div class="quantity"><button id="minus" aria-label="Decrease quantity">−</button><span id="quantity">1</span><button id="plus" aria-label="Increase quantity">+</button></div><button id="add" class="button" ${product.availability !== 'In Stock' ? 'disabled' : ''}>${product.availability === 'In Stock' ? 'Add to cart' : 'Out of stock'}</button></div></div></section>`; let quantity = 1; document.getElementById('minus').onclick = () => { quantity = Math.max(1, quantity - 1); document.getElementById('quantity').textContent = quantity; }; document.getElementById('plus').onclick = () => { quantity += 1; document.getElementById('quantity').textContent = quantity; }; document.getElementById('add').onclick = () => addToCart(product.id, quantity); }</script></body></html>
